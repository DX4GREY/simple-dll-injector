name: Build and Package Injector

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@master
        with:
          version: 1.11.1

      - name: Configure CMake
        run: >
          cmake -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=cl

      - name: Build Project
        run: cmake --build build --config Release

      - name: Prepare Artifact Directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging
          Copy-Item "build/injector.exe" -Destination "staging/"
          if (Test-Path "README.md") { Copy-Item "README.md" -Destination "staging/" }
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" -Destination "staging/" }
          Compress-Archive -Path "staging/*" -DestinationPath "Native-Injector-x64.zip"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Native-Injector-x64
          path: Native-Injector-x64.zip
          retention-days: 7

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Native-Injector-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
